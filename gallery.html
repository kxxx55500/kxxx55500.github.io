---
title: 画廊
permalink: /gallery/
layout: default
body_class: gallery-page
description: 圣莱纳镇的插画。
---
<article class="article">
  <header class="article-head">
    <h1 class="article-title">画廊</h1>
  </header>

  <div class="gallery">
    {%- for g in site.data.gallery_built %}
    <figure class="gallery-item">
      <img src="{{ g.small | relative_url }}"
           srcset="{{ g.small | relative_url }} 800w, {{ g.full | relative_url }} {{ g.width }}w"
           sizes="(min-width: 760px) 640px, 100vw"
           width="{{ g.width }}" height="{{ g.height }}"
           {% unless forloop.first %}loading="lazy" {% endunless %}decoding="async"
           alt="{{ g.alt }}">
      <figcaption>{{ g.title }}</figcaption>
    </figure>
    {%- endfor %}
  </div>
</article>
